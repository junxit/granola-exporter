[project]
name = "granola-exporter"
version = "0.1.0"
description = "Local, incremental archive of Granola meetings, transcripts and summaries."
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.scripts]
granola-export = "granola_exporter.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/granola_exporter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
