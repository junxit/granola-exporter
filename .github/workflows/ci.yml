name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a newly-published CVE in a pinned dependency surfaces even
    # when nothing in the repo has changed.
    - cron: "17 6 * * 1"
  workflow_dispatch:

# Least privilege: nothing here needs write access.
permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync (locked)
        run: uv sync --locked --dev

      - name: Run tests
        run: uv run pytest -q

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # osv-scanner reads uv.lock natively and queries the OSV database.
      # Fails the job if any pinned dependency has a known advisory.
      - name: Scan uv.lock for known vulnerabilities
        uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        with:
          scan-args: |-
            --lockfile=uv.lock
