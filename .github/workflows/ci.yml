name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a newly-published CVE in a pinned dependency surfaces even
    # when nothing in the repo has changed.
    - cron: "17 6 * * 1"
  workflow_dispatch:

# Least privilege: nothing here needs write access.
permissions:
  contents: read

# What a run installs is pinned rather than floating: the runner image; uv,
# whose version also decides which Python patch release each job downloads;
# and the actions, by commit SHA because a tag can be moved. Dependabot
# rewrites a pinned SHA together with its version comment.
jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The floor requires-python allows, and the newest. Left unpinned, uv
        # picks the newest alone, so the floor was never actually tested.
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.1"
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Sync (locked)
        run: uv sync --locked --dev

      - name: Run tests
        run: uv run pytest -q

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.1"
          enable-cache: true

      - name: Sync (locked)
        run: uv sync --locked --dev

      # The rule set is pinned in pyproject.toml, so a ruff upgrade cannot
      # change what this gate checks.
      - name: Ruff
        run: uv run ruff check

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # osv-scanner reads uv.lock natively and queries the OSV database.
      # Fails the job if any pinned dependency has a known advisory.
      - name: Scan uv.lock for known vulnerabilities
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --lockfile=uv.lock
