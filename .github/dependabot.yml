version: 2
updates:
  # Python. The lockfile carries a handful of direct dependencies and dozens
  # of transitive ones, most of them fast-moving (pydantic, starlette,
  # uvicorn, opentelemetry), so minor and patch bumps are batched into a
  # single weekly pull request.
  #
  # Major bumps are deliberately left ungrouped. Grouping is all-or-nothing: one
  # broken package blocks everything batched with it. That is an acceptable
  # trade for patches, but a major bump of an HTTP or validation library is
  # exactly the change that deserves its own pull request and its own CI run.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"
    groups:
      python-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Workflow actions, pinned by commit SHA with a version comment that Dependabot
  # reads and rewrites. A floating major tag hid new releases: setup-uv stopped
  # publishing them at v8, so Dependabot never offered v8 or later. These are
  # few, so every update -- major, minor or patch -- goes in one pull request.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"
    groups:
      github-actions:
        patterns:
          - "*"
