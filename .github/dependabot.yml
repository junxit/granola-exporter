version: 2
updates:
  # Python. The lockfile carries 3 direct dependencies and 37 transitive ones,
  # most of them fast-moving (pydantic, starlette, uvicorn, opentelemetry), so
  # minor and patch bumps are batched into a single weekly pull request.
  #
  # Major bumps are deliberately left ungrouped. Grouping is all-or-nothing: one
  # broken package blocks everything batched with it. That is an acceptable
  # trade for patches, but a major bump of an HTTP or validation library is
  # exactly the change that deserves its own pull request and its own CI run.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"
    groups:
      python-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Workflow actions. These are few, and their releases are almost always major
  # version tags (v4 -> v7), so grouping by update type would defeat the point.
  # Everything goes in one pull request.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"
    groups:
      github-actions:
        patterns:
          - "*"
